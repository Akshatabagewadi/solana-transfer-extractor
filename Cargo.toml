[package]
name = "solana-transfer-extractor"
version = "0.1.0"
edition = "2021"
description = "Substreams module extracting native SOL and SPL token transfers"

[lib]
name = "substreams"
crate-type = ["cdylib"]

[dependencies]
substreams = "0.5.0"
prost = "0.11"
bs58 = "0.4"

[build-dependencies]
prost-build = "0.11"
protoc-bin-vendored = "3"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
